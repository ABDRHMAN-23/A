lay:none}.hide-scroll{scrollbar-width:none}.lift{transition:transform .25s,box-shadow .25s}.lift:hover{transform:translateY(-5px);box-shadow:0 20px 45px rgba(11,23,48,.11)}.fade{animation:fade .45s ease both}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.shimmer{background:linear-gradient(90deg,#eee,#f8f8f8,#eee);background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}</style></head>
<body><div id="splash" aria-label="أُفُق"><div id="splashLogo"><div class="splash-mark">أُفُق</div><div class="splash-en">O F O Q</div><div class="splash-line"></div></div></div><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://hpcdwdcrdznmyzxkkpdp.supabase.co';
const SUPABASE_KEY='sb_publishable_GGThcQrcJyChQkFRrptrxQ_wxwpmovx';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const demo=[
{id:'d1',name_ar:'iPhone 15 Pro Max',price:3499,currency:'SAR',condition:'nearly_new',images:['https://images.unsplash.com/photo-1696446701796-da61225697cc?auto=format&fit=crop&w=900&q=80'],seller:{store_name:'متجر التقنية',rating:4.9}},
{id:'d2',name_ar:'MacBook Pro 14',price:5290,currency:'SAR',condition:'used',images:['https://images.unsplash.com/photo-1517336714739-489689fd1ca8?auto=format&fit=crop&w=900&q=80'],seller:{store_name:'عالم الكمبيوتر',rating:4.8}},
{id:'d3',name_ar:'كرسي Lounge فاخر',price:690,currency:'SAR',condition:'new',images:['https://images.unsplash.com/photo-1555041469-a586c61ea9bc?auto=format&fit=crop&w=900&q=80'],seller:{store_name:'بيت الأثاث',rating:4.7}},
{id:'d4',name_ar:'PlayStation 5 Slim',price:1750,currency:'SAR',condition:'nearly_new',images:['https://images.unsplash.com/photo-1606813907291-d86efa9b94db?auto=format&fit=crop&w=900&q=80'],seller:{store_name:'Gaming Zone',rating:4.9}}
];
const cats=[['📱','إلكترونيات'],['💻','أجهزة كمبيوتر'],['🛋️','أثاث ومنزل'],['👟','ملابس وأحذية'],['🎮','ألعاب'],['🧰','أدوات ومعدات'],['⌚','عطور وإكسسوارات'],['🚗','سيارات وقطع غيار']];
let products=demo,cart=JSON.parse(localStorage.ofoqCart||'[]'),query='';
const money=n=>new Intl.NumberFormat('ar-SA').format(n)+' ر.س';
const cond=c=>({new:'جديد',nearly_new:'شبه جديد',used:'مستعمل'}[c]||c);
function card(p){return `<article class="lift bg-white rounded-[28px] overflow-hidden border border-slate-100 cursor-pointer" onclick="openProduct('${p.id}')"><div class="relative aspect-[4/3] bg-slate-100 overflow-hidden"><img src="${p.images?.[0]||''}" class="w-full h-full object-cover" loading="lazy"><span class="absolute top-3 right-3 px-3 py-1 rounded-full bg-white/90 text-xs font-bold">${cond(p.condition)}</span><button onclick="event.stopPropagation();addCart('${p.id}')" class="absolute bottom-3 left-3 w-11 h-11 rounded-full bg-navy text-white grid place-items-center shadow-lg">+</button></div><div class="p-4"><div class="text-xs text-slate-400 mb-1">${p.seller?.store_name||'بائع موثّق'}</div><h3 class="font-bold truncate">${p.name_ar}</h3><div class="flex items-center justify-between mt-3"><strong class="text-lg">${money(p.price)}</strong><span class="text-xs text-slate-400">★ ${p.seller?.rating||'—'}</span></div><div class="mt-3 text-xs text-slate-500">🚚 شحن من جدة إلى اليمن</div></div></article>`}
function render(){document.getElementById('app').innerHTML=`<header class="sticky top-0 z-40 bg-navy text-white shadow-lg"><div class="max-w-7xl mx-auto px-4"><div class="h-20 flex items-center gap-5"><button class="md:hidden text-2xl" onclick="toggleMenu()">☰</button><div class="shrink-0"><div class="text-3xl font-extrabold tracking-tight">أُفُق</div><div class="text-[9px] tracking-[.3em] text-gold text-center -mt-1">O F O Q</div></div><nav id="menu" class="hidden md:flex gap-5 text-sm text-slate-200"><a href="#home">الرئيسية</a><a href="#categories">التصنيفات</a><a href="#stores">المتاجر</a><a href="#deals">العروض</a></nav><div class="flex items-center gap-2"><button onclick="openAuth()" class="hidden sm:block bg-white/10 border border-white/20 px-4 py-2 rounded-xl text-sm font-bold">تسجيل الدخول</button><button onclick="openAccount()" class="hidden sm:block text-sm">حسابي</button></div><div class="flex-1 max-w-xl mx-auto relative"><input oninput="query=this.value;filter()" value="${query}" class="w-full bg-white text-slate-900 rounded-2xl h-12 pr-5 pl-12 outline-none" placeholder="ابحث عن منتج أو متجر..."><span class="absolute left-4 top-3 text-xl text-slate-400">⌕</span></div><button class="relative text-2xl" onclick="showCart()">🛒<span id="cartCount" class="absolute -top-2 -left-2 bg-gold text-navy text-[10px] w-5 h-5 rounded-full grid place-items-center">${cart.length}</span></button><button class="hidden sm:block text-xl">♡</button></div></div></header>
<main id="home"><section class="max-w-7xl mx-auto px-4 pt-6"><div class="rounded-[36px] overflow-hidden bg-navy min-h-[430px] relative text-white"><img src="https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=1800&q=85" class="absolute inset-0 w-full h-full object-cover opacity-25"><div class="relative p-8 md:p-16 max-w-2xl flex flex-col justify-center min-h-[430px]"><span class="text-gold font-bold mb-4">من جدة إلى اليمن</span><h1 class="text-4xl md:text-6xl font-extrabold leading-tight">اكتشف منتجات<br><span class="text-gold">سوق جدة</span> بسهولة.</h1><p class="mt-5 text-slate-200 text-lg leading-8">تسوّق من متاجر وباعة جدة، واطلب وصول مشترياتك إلى اليمن عبر منظومة شحن واضحة وآمنة.</p><div class="flex gap-3 mt-8"><a href="#products" class="bg-white text-navy px-6 py-3 rounded-2xl font-bold">ابدأ التسوق</a><a href="#how" class="border border-white/30 px-6 py-3 rounded-2xl font-bold">كيف يعمل؟</a></div></div></div></section>
<section id="categories" class="max-w-7xl mx-auto px-4 py-10"><div class="flex items-end justify-between mb-5"><div><p class="text-gold font-bold text-sm">استكشف</p><h2 class="text-2xl font-extrabold">تسوّق حسب الفئة</h2></div></div><div class="flex gap-3 overflow-x-auto hide-scroll pb-2">${cats.map(c=>`<button onclick="query='${c[1]}';filter()" class="shrink-0 bg-white border border-slate-100 rounded-2xl px-5 py-4 min-w-[125px] text-right lift"><div class="text-2xl mb-2">${c[0]}</div><b class="text-sm">${c[1]}</b></button>`).join('')}</div></section>
<section id="products" class="max-w-7xl mx-auto px-4 pb-14"><div class="flex items-end justify-between mb-5"><div><p class="text-gold font-bold text-sm">اختيارات أُفُق</p><h2 class="text-2xl font-extrabold">منتجات تستحق المشاهدة</h2></div><span id="resultText" class="text-sm text-slate-400"></span></div><div id="grid" class="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">${products.map(card).join('')}</div></section>
<section id="how" class="bg-white border-y border-slate-100"><div class="max-w-7xl mx-auto px-4 py-14"><h2 class="text-3xl font-extrabold text-center">من جدة إلى بابك في اليمن</h2><div class="grid md:grid-cols-4 gap-5 mt-10">${[['01','اختر المنتج','تصفح منتجات الباعة والمتاجر في جدة.'],['02','أضف للسلة','اجمع مشترياتك حتى من متاجر مختلفة.'],['03','ادفع لأُفُق','نحسب المنتج والشحن والخدمات بوضوح.'],['04','تتبع طلبك','تابع الطلب حتى وصوله إلى اليمن.']].map(x=>`<div class="rounded-3xl bg-cream p-6"><span class="text-gold font-extrabold">${x[0]}</span><h3 class="font-bold text-lg mt-5">${x[1]}</h3><p class="text-slate-500 text-sm mt-2 leading-7">${x[2]}</p></div>`).join('')}</div></div></section>
</main><footer class="bg-navy text-white mt-12"><div class="max-w-7xl mx-auto px-4 py-10 flex flex-col md:flex-row justify-between gap-6"><div><div class="text-3xl font-extrabold">أُفُق</div><p class="text-slate-400 mt-2">سوق يربط جدة باليمن.</p></div><div class="text-slate-400 text-sm">© 2026 OFOQ. جميع الحقوق محفوظة.</div></div></footer><div id="modal"></div>`;loadProducts();updateCount()}
async function loadProducts(){try{const {data}=await db.from('ofoq_products').select('*, seller:ofoq_sellers(store_name,rating)').eq('is_active',true).order('created_at',{ascending:false});if(data?.length){products=data;drawGrid(products)}}catch(e){console.log(e)}}
async function loadOfoqSettings(){try{const {data}=await db.from('ofoq_settings').select('shipping_base_sar,aden_delivery_sar,default_commission_percent').eq('id',true).maybeSingle();if(data){window.ofoqShippingBase=Number(data.shipping_base_sar||0);window.ofoqAdenDelivery=Number(data.aden_delivery_sar||0);window.ofoqCommission=Number(data.default_commission_percent||10);}}catch(e){console.log(e)}}
function drawGrid(list){document.getElementById('grid').innerHTML=list.length?list.map(card).join(''):'<div class="col-span-full py-16 text-center text-slate-400">لا توجد نتائج مطابقة.</div>';document.getElementById('resultText').textContent=list.length+' منتج'}
function filter(){const q=query.toLowerCase();drawGrid(products.filter(p=>(p.name_ar||'').toLowerCase().includes(q)||(p.name_en||'').toLowerCase().includes(q)||(p.seller?.store_name||'').toLowerCase().includes(q)))}
function updateCount(){document.getElementById('cartCount').textContent=cart.length}
function addCart(id){const p=products.find(x=>x.id===id);if(!p)return;if(!cart.find(x=>x.id===id))cart.push({id:p.id,name:p.name_ar,price:p.price,image:p.images?.[0]});localStorage.ofoqCart=JSON.stringify(cart);updateCount();toast('تمت إضافة المنتج إلى السلة')}
function toast(t){const d=document.createElement('div');d.className='fixed bottom-5 left-5 z-50 bg-navy text-white px-5 py-3 rounded-2xl shadow-xl fade';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}

function cartTotals(){const subtotal=cart.reduce((s,x)=>s+(Number(x.price)||0)*(x.quantity||1),0);const service=Math.round(subtotal*Number(window.ofoqCommission||10)/100*100)/100;const shipping=Number(window.ofoqShippingBase||0)+Number(window.ofoqAdenDelivery||0);return{subtotal,service,shipping,total:subtotal+service+shipping}}
function changeQty(id,d){const x=cart.find(i=>i.id===id);if(!x)return;x.quantity=Math.max(1,(x.quantity||1)+d);localStorage.ofoqCart=JSON.stringify(cart);showCart();updateCount()}
function removeCart(id){cart=cart.filter(x=>x.id!==id);localStorage.ofoqCart=JSON.stringify(cart);showCart();updateCount()}
function showCart(){const t=cartTotals();document.getElementById('modal').innerHTML='<div onclick="this.remove()" class="fixed inset-0 z-50 bg-black/40 flex items-end md:items-center justify-center p-4"><div onclick="event.stopPropagation()" class="bg-white rounded-[30px] p-6 w-full max-w-2xl max-h-[88vh] overflow-auto"><div class="flex justify-between items-center"><h2 class="text-2xl font-extrabold">سلة التسوق</h2><button onclick="document.getElementById(\'modal\').innerHTML=\'\'">✕</button></div>'+(cart.length?'<div class="mt-5 space-y-3">'+cart.map(x=>'<div class="flex gap-3 items-center border rounded-2xl p-3"><img src="'+x.image+'" class="w-20 h-20 rounded-xl object-cover"><div class="flex-1 min-w-0"><b class="block truncate">'+x.name+'</b><div class="text-slate-500">'+money(x.price)+'</div><div class="flex items-center gap-2 mt-2"><button onclick="changeQty(\''+x.id+'\',-1)" class="w-8 h-8 rounded-lg bg-slate-100">−</button><span>'+ (x.quantity||1) +'</span><button onclick="changeQty(\''+x.id+'\',1)" class="w-8 h-8 rounded-lg bg-slate-100">+</button></div></div><button onclick="removeCart(\''+x.id+'\')" class="text-red-500">حذف</button></div>').join('')+'</div><div class="mt-6 bg-cream rounded-2xl p-5"><div class="flex justify-between"><span>المجموع الفرعي</span><b>'+money(t.subtotal)+'</b></div><div class="flex justify-between mt-2"><span>الشحن إلى اليمن</span><b>'+money(t.shipping)+'</b></div><div class="flex justify-between mt-2"><span>رسوم الخدمة</span><b>'+money(t.service)+'</b></div><div class="flex justify-between border-t mt-3 pt-3 text-lg"><span>الإجمالي</span><b>'+money(t.total)+'</b></div><button onclick="openCheckout()" class="w-full mt-4 bg-navy text-white py-4 rounded-2xl font-bold">متابعة الدفع</button></div>':'<div class="py-14 text-center text-slate-400">السلة فارغة حاليًا.</div>')+'</div></div>'}
function openCheckout(){db.auth.getUser().then(async({data:{user}})=>{if(!user){openAuth();return}const {data:p}=await db.from('ofoq_profiles').select('*').eq('id',user.id).maybeSingle();const t=cartTotals();document.getElementById('modal').innerHTML='<div class="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4"><div class="bg-white rounded-[30px] p-7 w-full max-w-2xl max-h-[90vh] overflow-auto"><div class="flex justify-between"><h2 class="text-2xl font-extrabold">إتمام الطلب</h2><button onclick="showCart()">✕</button></div><div class="grid md:grid-cols-2 gap-3 mt-6"><input id="coName" value="'+(p?.full_name||'')+'" class="p-4 rounded-2xl bg-slate-50" placeholder="الاسم الكامل *"><input id="coPhone" value="'+(p?.phone||'')+'" class="p-4 rounded-2xl bg-slate-50" placeholder="رقم الهاتف *"><input id="coCity" value="Aden" class="p-4 rounded-2xl bg-slate-50" placeholder="المدينة"><input id="coDistrict" class="p-4 rounded-2xl bg-slate-50" placeholder="المديرية / المنطقة"><input id="coAddress" class="p-4 rounded-2xl bg-slate-50 md:col-span-2" placeholder="العنوان بالتفصيل"><select id="coPay" class="p-4 rounded-2xl bg-slate-50 md:col-span-2"><option value="manual_transfer">تحويل بنكي / دفع يدوي — بانتظار مراجعة الإدارة</option></select><textarea id="coNotes" class="p-4 rounded-2xl bg-slate-50 md:col-span-2 h-24" placeholder="ملاحظات الطلب (اختياري)"></textarea></div><div class="mt-5 bg-cream rounded-2xl p-5"><div class="flex justify-between"><span>المنتجات</span><b>'+money(t.subtotal)+'</b></div><div class="flex justify-between mt-2"><span>رسوم الخدمة</span><b>'+money(t.service)+'</b></div><div class="flex justify-between border-t mt-3 pt-3 text-xl"><span>الإجمالي</span><b>'+money(t.total)+'</b></div></div><button onclick="placeOrder()" class="w-full mt-5 bg-navy text-white py-4 rounded-2xl font-bold">تأكيد إنشاء الطلب</button><p id="coMsg" class="text-center text-sm mt-3 text-slate-500"></p></div></div>'})}
async function placeOrder(){const msg=document.getElementById('coMsg');msg.textContent='جاري إنشاء الطلب...';const {data,error}=await db.rpc('ofoq_create_order',{p_items:cart.map(x=>({product_id:x.id,quantity:x.quantity||1})),p_customer_name:document.getElementById('coName').value.trim(),p_customer_phone:document.getElementById('coPhone').value.trim(),p_city:document.getElementById('coCity').value.trim()||'Aden',p_district:document.getElementById('coDistrict').value.trim()||null,p_address:document.getElementById('coAddress').value.trim()||null,p_notes:document.getElementById('coNotes').value.trim()||null,p_payment_method:document.getElementById('coPay').value});if(error){msg.textContent=error.message;return}const id=data;const {data:payment}=await db.from('ofoq_payments').select('id').eq('order_id',id).maybeSingle();if(payment?.id){document.getElementById('modal').innerHTML='<div class="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4"><div class="bg-white rounded-[30px] p-7 w-full max-w-md"><h2 class="text-2xl font-extrabold">إرفاق إيصال الدفع</h2><p class="text-slate-500 text-sm mt-2">ارفع صورة واضحة للإيصال ليتم مراجعته من الإدارة.</p><input id="receiptFile" type="file" accept="image/*" class="w-full mt-5 p-4 rounded-2xl bg-slate-50"><input id="receiptRef" class="w-full mt-3 p-4 rounded-2xl bg-slate-50" placeholder="رقم المرجع / العملية (اختياري)"><button onclick="submitReceipt(\''+id+'\',\''+payment.id+'\')" class="w-full mt-5 bg-navy text-white py-4 rounded-2xl font-bold">إرسال الإيصال</button><button onclick="finishOrder(\''+id+'\')" class="w-full mt-2 py-3 text-slate-500">سأرفقه لاحقًا</button><p id="receiptMsg" class="text-center text-sm mt-3 text-slate-500"></p></div></div>';}else finishOrder(id)}
async function submitReceipt(orderId,paymentId){const msg=document.getElementById('receiptMsg'),file=document.getElementById('receiptFile').files[0];if(!file){msg.textContent='اختر صورة الإيصال.';return}if(file.size>5*1024*1024){msg.textContent='حجم الإيصال يجب ألا يتجاوز 5MB.';return}const {data:{user}}=await db.auth.getUser();const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const path=user.id+'/'+orderId+'/'+crypto.randomUUID()+'.'+ext;msg.textContent='جاري رفع الإيصال...';const up=await db.storage.from('ofoq-receipts').upload(path,file,{upsert:false,contentType:file.type});if(up.error){msg.textContent=up.error.message;return}const {error}=await db.rpc('ofoq_submit_payment_receipt',{p_payment_id:paymentId,p_reference:document.getElementById('receiptRef').value.trim(),p_receipt_url:path});if(error){msg.textContent=error.message;return}finishOrder(orderId)}
function finishOrder(id){cart=[];localStorage.ofoqCart='[]';updateCount();document.getElementById('modal').innerHTML='<div class="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4"><div class="bg-white rounded-[30px] p-8 w-full max-w-md text-center"><div class="text-4xl text-emerald-600">✓</div><h2 class="text-2xl font-extrabold mt-4">تم إنشاء طلبك</h2><p class="text-slate-500 mt-2">تم إرسال الطلب، ويمكن للإدارة مراجعة الدفع ثم تحديث حالة الشحن.</p><div class="mt-5 bg-cream rounded-2xl p-4">رقم الطلب<br><b class="text-lg">'+id.slice(0,10).toUpperCase()+'</b></div><button onclick="openAccount()" class="w-full mt-5 bg-navy text-white py-3 rounded-2xl font-bold">متابعة طلباتي</button></div></div>'}

async function openSellerDashboard(){const {data:{user}}=await db.auth.getUser();const {data:seller}=await db.from('ofoq_sellers').select('*').eq('user_id',user.id).maybeSingle();if(!seller){toast('لم يتم ربط حساب البائع بمتجر بعد');return}const [{data:prods},{data:wallet},{data:orders}]=await Promise.all([db.from('ofoq_products').select('*').eq('seller_id',seller.id).order('created_at',{ascending:false}),db.from('ofoq_seller_wallets').select('*').eq('seller_id',seller.id).maybeSingle(),db.from('ofoq_order_items').select('*').eq('seller_id',seller.id).order('created_at',{ascending:false})]);document.getElementById('modal').innerHTML=`<div class="fixed inset-0 z-50 bg-cream overflow-auto"><div class="max-w-6xl mx-auto p-4 md:p-8"><div class="flex items-center justify-between mb-6"><div><p class="text-gold font-bold text-sm">لوحة البائع</p><h2 class="text-3xl font-extrabold">${seller.store_name}</h2><p class="text-slate-500 text-sm mt-1">حساب معتمد • جدة</p></div><div class="flex gap-2"><button onclick="sellerAddProduct('${seller.id}')" class="bg-navy text-white px-4 py-3 rounded-2xl font-bold">+ إضافة منتج</button><button onclick="document.getElementById('modal').innerHTML='';render()" class="bg-white px-4 py-3 rounded-2xl">إغلاق</button></div></div><div class="grid md:grid-cols-3 gap-4 mb-6"><div class="bg-navy text-white rounded-3xl p-6"><span class="text-slate-300 text-sm">الرصيد المتاح</span><div class="text-3xl font-extrabold mt-2">${money(wallet?.balance_sar||0)}</div></div><div class="bg-white rounded-3xl p-6"><span class="text-slate-400 text-sm">قيد التسوية</span><div class="text-3xl font-extrabold mt-2">${money(wallet?.pending_sar||0)}</div></div><div class="bg-white rounded-3xl p-6"><span class="text-slate-400 text-sm">إجمالي المنتجات</span><div class="text-3xl font-extrabold mt-2">${prods?.length||0}</div></div></div><div class="grid lg:grid-cols-2 gap-6"><section class="bg-white rounded-3xl p-6"><h3 class="text-xl font-extrabold mb-4">منتجات المتجر</h3><div class="space-y-3">${(prods||[]).map(x=>`<div class="flex gap-3 items-center border-b pb-3"><img src="${x.images?.[0]||''}" class="w-16 h-16 rounded-xl object-cover bg-slate-100"><div class="flex-1"><b>${x.name_ar}</b><div class="text-sm text-slate-500">${money(x.price)} • ${cond(x.condition)} • المخزون ${x.stock||0}</div></div><span class="text-xs px-2 py-1 rounded-full ${x.is_active?'bg-emerald-50 text-emerald-700':'bg-slate-100 text-slate-500'}">${x.is_active?'منشور':'مخفي'}</span></div>`).join('')||'<p class="text-slate-400 py-8 text-center">لا توجد منتجات بعد.</p>'}</div></section><section class="bg-white rounded-3xl p-6"><h3 class="text-xl font-extrabold mb-4">آخر عمليات البيع</h3><div class="space-y-3">${(orders||[]).slice(0,8).map(o=>`<div class="flex justify-between border-b pb-3"><div><b>${o.product_name}</b><div class="text-xs text-slate-400">الكمية: ${o.quantity||1}</div></div><strong>${money(o.seller_amount_sar||0)}</strong></div>`).join('')||'<p class="text-slate-400 py-8 text-center">لا توجد مبيعات بعد.</p>'}</div></section></div></div></div>`}
function sellerAddProduct(sellerId){document.getElementById('modal').innerHTML=`<div class="fixed inset-0 z-[60] bg-black/50 flex items-center justify-center p-4"><div class="bg-white rounded-[30px] p-7 w-full max-w-2xl max-h-[90vh] overflow-auto"><div class="flex justify-between"><h2 class="text-2xl font-extrabold">إضافة منتج</h2><button onclick="openSellerDashboard()">✕</button></div><div class="grid md:grid-cols-2 gap-3 mt-6"><input id="spName" class="p-4 rounded-2xl bg-slate-50" placeholder="اسم المنتج"><input id="spPrice" type="number" class="p-4 rounded-2xl bg-slate-50" placeholder="السعر بالريال السعودي"><select id="spCond" class="p-4 rounded-2xl bg-slate-50"><option value="new">جديد</option><option value="nearly_new">شبه جديد</option><option value="used">مستعمل</option></select><input id="spStock" type="number" value="1" class="p-4 rounded-2xl bg-slate-50" placeholder="المخزون"><input id="spImage" type="file" accept="image/*" class="p-4 rounded-2xl bg-slate-50 md:col-span-2"><p class="md:col-span-2 text-xs text-slate-400">يمكنك رفع صورة المنتج مباشرة إلى أُفُق.</p><input id="spWeight" type="number" step="0.01" class="p-4 rounded-2xl bg-slate-50" placeholder="الوزن بالكيلو (اختياري)"><input id="spDays" type="number" class="p-4 rounded-2xl bg-slate-50" placeholder="مدة الشحن بالأيام"><textarea id="spDesc" class="p-4 rounded-2xl bg-slate-50 md:col-span-2 h-32" placeholder="وصف المنتج وحالته والتفاصيل"></textarea></div><button onclick="saveSellerProduct('${sellerId}')" class="w-full mt-5 bg-navy text-white py-4 rounded-2xl font-bold">حفظ المنتج</button><p id="spMsg" class="text-center text-sm mt-3 text-slate-500"></p></div></div>`}
async function saveSellerProduct(sellerId){const msg=document.getElementById('spMsg');const file=document.getElementById('spImage').files[0];if(!file){msg.textContent='اختر صورة للمنتج.';return}if(file.size>5*1024*1024){msg.textContent='حجم الصورة يجب ألا يتجاوز 5MB.';return}const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const path=sellerId+'/'+crypto.randomUUID()+'.'+ext;msg.textContent='جاري رفع الصورة...';const up=await db.storage.from('ofoq-products').upload(path,file,{upsert:false,contentType:file.type});if(up.error){msg.textContent=up.error.message;return}const image=db.storage.from('ofoq-products').getPublicUrl(path).data.publicUrl;const payload={seller_id:sellerId,name_ar:document.getElementById('spName').value.trim(),price:Number(document.getElementById('spPrice').value),currency:'SAR',condition:document.getElementById('spCond').value,stock:Number(document.getElementById('spStock').value||1),images:[image],weight_kg:Number(document.getElementById('spWeight').value)||null,shipping_estimate_days:Number(document.getElementById('spDays').value)||null,description_ar:document.getElementById('spDesc').value.trim(),is_active:true};if(!payload.name_ar||!payload.price){msg.textContent='أدخل اسم المنتج والسعر.';return}const {error}=await db.from('ofoq_products').insert(payload);msg.textContent=error?error.message:'تم رفع الصورة ونشر المنتج بنجاح';if(!error)setTimeout(openSellerDashboard,700)}
async function openAdminDashboard(){const {data:{user}}=await db.auth.getUser();const {data:sellers}=await db.from('ofoq_sellers').select('*').order('created_at',{ascending:false});const {data:prods}=await db.from('ofoq_products').select('id,seller_id,name_ar,price,is_active,created_at').order('created_at',{ascending:false});document.getElementById('modal').innerHTML=`<div class="fixed inset-0 z-50 bg-cream overflow-auto"><div class="max-w-7xl mx-auto p-4 md:p-8"><div class="flex items-center justify-between mb-6"><div><p class="text-gold font-bold text-sm">إدارة أُفُق</p><h2 class="text-3xl font-extrabold">لوحة الإدارة</h2><p class="text-slate-500 text-sm">هذه الصفحة لا تظهر للزوار أو العملاء.</p></div><button onclick="document.getElementById('modal').innerHTML='';render()" class="bg-white px-4 py-3 rounded-2xl">إغلاق</button></div><div class="grid md:grid-cols-3 gap-4 mb-6"><div class="bg-navy text-white rounded-3xl p-6"><span class="text-slate-300 text-sm">المتاجر</span><div class="text-3xl font-extrabold mt-2">${sellers?.length||0}</div></div><div class="bg-white rounded-3xl p-6"><span class="text-slate-400 text-sm">المنتجات</span><div class="text-3xl font-extrabold mt-2">${prods?.length||0}</div></div><div class="bg-white rounded-3xl p-6"><span class="text-slate-400 text-sm">المنتجات المنشورة</span><div class="text-3xl font-extrabold mt-2">${prods?.filter(x=>x.is_active).length||0}</div></div></div><div class="flex justify-end mb-4"><button onclick="adminCreateSeller()" class="bg-navy text-white px-5 py-3 rounded-2xl font-bold">+ إنشاء حساب بائع</button></div><section class="bg-white rounded-3xl p-6 mb-6"><h3 class="text-xl font-extrabold mb-4">الملخص المالي</h3><div id="adminFinance" class="grid md:grid-cols-4 gap-3">جاري التحميل...</div></section><section class="bg-white rounded-3xl p-6 mb-6"><h3 class="text-xl font-extrabold mb-4">المدفوعات</h3><div id="adminPayments" class="space-y-3 text-sm">جاري التحميل...</div></section><section class="bg-white rounded-3 async function createSeller(){const payload={name:document.getElementById('asName').value.trim(),store_name:document.getElementById('asStore').value.trim(),email:document.getElementById('asEmail').value.trim(),password:document.getElementById('asPass').value,phone:document.getElementById('asPhone').value.trim(),whatsapp:document.getElementById('asWa').value.trim(),area:document.getElementById('asArea').value.trim(),description:document.getElementById('asDesc').value.trim(),commission_percent:Number(document.getElementById('asCommission').value||10)};const {data:{session}}=await db.auth.getSession();const res=await fetch(SUPABASE_URL+'/functions/v1/ofoq-admin-create-seller',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify(payload)});const out=await res.json();document.getElementById('asMsg').textContent=out.error||'تم إنشاء حساب البائع واعتماده وربطه بالمتجر.';if(!out.error)setTimeout(openAdminDashboard,700)}

/* OFOQ UX hardening: customer order center, receipt retry, shipment timeline, seller ledger, safer cart grouping */
const OFOQ_STATUS={pending:'بانتظار التأكيد',confirmed:'تم التأكيد',preparing:'جاري التجهيز',picked_up:'تم الاستلام من البائع',in_transit:'في الطريق إلى اليمن',arrived_aden:'وصل عدن',ready:'جاهز للتسليم',delivered:'تم التسليم',cancelled:'ملغي'};
const OFOQ_STEPS=['confirmed','preparing','picked_up','in_transit','arrived_aden','ready','delivered'];
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function statusLabel(s){return OFOQ_STATUS[s]||s||'غير محدد'}
function orderStepIndex(s){const i=OFOQ_STEPS.indexOf(s);return i<0?0:i}
function paymentLabel(s){return ({pending:'قيد المراجعة',paid:'تم التحقق من الدفع',rejected:'مرفوض',failed:'فشل الدفع'}[s]||s||'غير محدد')}
function addCart(id){
 const p=products.find(x=>x.id===id); if(!p)return;
 const old=cart.find(x=>x.id===id);
 if(old){old.quantity=(old.quantity||1)+1}
 else cart.push({id:p.id,name:p.name_ar,price:p.price,image:p.images?.[0],seller_id:p.seller_id||p.seller?.id,seller_name:p.seller?.store_name||'بائع موثّق',quantity:1});
 localStorage.ofoqCart=JSON.stringify(cart);updateCount();toast(old?'تمت زيادة الكمية':'تمت إضافة المنتج إلى السلة');
}
function cartTotals(){
 const subtotal=cart.reduce((s,x)=>s+(Number(x.price)||0)*(x.quantity||1),0);
 const service=Math.round(subtotal*Number(window.ofoqCommission||10))/100;
 const shipping=Number(window.ofoqShippingBase||0)+Number(window.ofoqAdenDelivery||0);
 return{subtotal,service,shipping,total:subtotal+service+shipping}
}
function showCart(){

 document.getElementById('modal').innerHTML='<div onclick="this.remove()" class="fixed inset-0 z-50 bg-black/40 flex items-end md:items-center justify-center p-4"><div onclick="event.stopPropagation()" class="bg-white rounded-[30px] p-6 w-full max-w-3xl max-h-[90vh] overflow-auto"><div class="flex justify-between items-center"><div><p class="text-gold text-sm font-bold">OFOQ CART</p><h2 class="text-2xl font-extrabold">سلة التسوق</h2></div><button onclick="document.getElementById(\'modal\').innerHTML=\'\'" class="w-10 h-10 rounded-xl bg-slate-100">✕</button></div>'+(cart.length?'<div class="mt-5 space-y-5">'+Object.values(groups).map(g=>'<section class="rounded-2xl border border-slate-100 overflow-hidden"><div class="px-4 py-3 bg-slate-50 font-bold">'+esc(g[0].seller_name||'بائع موثّق')+'</div><div class="p-3 space-y-3">'+g.map(x=>'<div class="flex gap-3 items-center"><img src="'+esc(x.image||'')+'" class="w-20 h-20 rounded-xl object-cover bg-slate-100"><div class="flex-1 min-w-0"><b class="block truncate">'+esc(x.name)+'</b><div class="text-slate-500">'+money(x.price)+'</div><div class="flex items-center gap-2 mt-2"><button onclick="changeQty(\''+x.id+'\',-1)" class="w-8 h-8 rounded-lg bg-slate-100">−</button><span class="min-w-5 text-center">'+(x.quantity||1)+'</span><button onclick="changeQty(\''+x.id+'\',1)" class="w-8 h-8 rounded-lg bg-slate-100">+</button></div></div><button onclick="removeCart(\''+x.id+'\')" class="text-red-500 text-sm">حذف</button></div>').join('')+'</div></section>').join('')+'</div><div class="mt-6 bg-cream rounded-2xl p-5 space-y-2"><div class="flex justify-between"><span>المجموع الفرعي</span><b>'+money(t.subtotal)+'</b></div><div class="flex justify-between"><span>الشحن إلى اليمن</span><b>'+money(t.shipping)+'</b></div><div class="flex justify-between"><span>رسوم الخدمة</span><b>'+money(t.service)+'</b></div><div class="flex justify-between border-t mt-3 pt-3 text-xl"><span>الإجمالي</span><b>'+money(t.total)+'</b></div><p class="text-xs text-slate-400 pt-2">رسوم الشحن الظاهرة هنا تقديرية، والحساب النهائي المعتمد يتم عند إنشاء الطلب.</p><button onclick="openCheckout()" class="w-full mt-4 bg-navy text-white py-4 rounded-2xl font-bold">متابعة الدفع</button></div>':'<div class="py-14 text-center text-slate-400">السلة فارغة حاليًا.</div>')+'</div></div>'
}

 const idx=orderStepIndex(ship?.status||o.status),stepNames=[['confirmed','تم تأكيد الطلب'],['preparing','جاري تجهيز الطلب'],['picked_up','استلمت الشحنة من البائع'],['in_transit','في الطريق إلى اليمن'],['arrived_aden','وصلت عدن'],['ready','جاهزة للتسليم'],['delivered','تم التسليم']];
 document.getElementById('modal').innerHTML='<div class="fixed inset-0 z-[60] bg-black/50 flex items-center justify-center p-4"><div class="bg-white rounded-[32px] p-6 md:p-8 w-full max-w-3xl max-h-[92vh] overflow-auto"><div class="flex justify-between items-center"><div><p class="text-gold text-sm font-bold">تتبع الطلب</p><h2 class="text-2xl font-extrabold">#'+id.slice(0,10).toUpperCase()+'</h2></div><button onclick="customerOrders()" class="w-10 h-10 rounded-xl bg-slate-100">✕</button></div><div class="grid md:grid-cols-2 gap-4 mt-6"><section class="rounded-2xl bg-cream p-5"><div class="text-sm text-slate-500">حالة الطلب</div><div class="text-xl font-extrabold mt-1">'+statusLabel(o.status)+'</div><div class="mt-3 text-sm">الدفع: <b>'+paymentLabel(pay?.status)+'</b></div></section><section class="rounded-2xl bg-cream p-5"><div class="text-sm text-slate-500">الوصول المتوقع</div><div class="text-xl font-extrabold mt-1">'+(ship?.estimated_days?ship.estimated_days+' أيام تقريبًا':'يحدد بعد استلام الشحنة')+'</div><div class="mt-3 text-sm">رقم التتبع: <b>'+esc(ship?.tracking_code||'سيظهر عند توفره')+'</b></div></section></div><section class="mt-5 bg-white border rounded-2xl p-5"><h3 class="font-extrabold">رحلة الشحنة</h3><div class="mt-5 space-y-4">'+stepNames.map((x,i)=>'<div class="flex gap-3 items-start"><div class="w-8 h-8 rounded-full '+(i<=idx?'bg-navy text-white':'bg-slate-100 text-slate-400')+' grid place-items-center text-xs font-bold">'+(i+1)+'</div><div><b class="'+(i<=idx?'text-navy':'text-slate-400')+'">'+x[1]+'</b>'+((i===idx&&ship?.status_updated_at)?'<div class="text-xs text-slate-400 mt-1">آخر تحديث: '+new Date(ship.status_updated_at).toLocaleString('ar-SA')+'</div>':'')+'</div></div>').join('')+'</div></section><section class="mt-5 bg-slate-50 rounded-2xl p-5"><h3 class="font-extrabold mb-3">الدفع</h3><div class="flex justify-between text-sm"><span>الحالة</span><b>'+paymentLabel(pay?.status)+'</b></div><div class="flex justify-between text-sm mt-2"><span>المرجع</span><b>'+esc(pay?.payment_reference||'غير مضاف')+'</b></div>'+(pay?.status!=='paid'?'<div class="mt-4"><input id="retryReceiptFile" type="file" accept="image/*" class="w-full p-3 rounded-xl bg-white border"><input id="retryReceiptRef" value="'+esc(pay?.payment_reference||'')+'" class="w-full mt-2 p-3 rounded-xl bg-white border" placeholder="رقم المرجع / العملية"><button onclick="retryReceipt(\''+id+'\',\''+(pay?.id||'')+'\')" class="w-full mt-3 bg-navy text-white py-3 rounded-xl font-bold">إرسال / إعادة إرسال الإيصال</button><p id="retryMsg" class="text-xs text-slate-500 mt-2"></p></div>':'<div class="mt-3 text-emerald-700 font-bold">تم التحقق من الدفع.</div>')+'</section><section class="mt-5 bg-navy text-white rounded-2xl p-5"><div class="flex justify-between"><span>الإجمالي</span><b class="text-xl">'+money(o.total_sar)+'</b></div></section></div></div>'
}
async function retryReceipt(orderId,paymentId){
 const msg=document.getElementById('retryMsg'),file=document.getElementById('retryReceiptFile')?.files[0];
 if(!paymentId){msg.textContent='لم يتم العثور على عملية الدفع.';return}
 if(!file){msg.textContent='اختر صورة الإيصال أولًا.';return}
 if(file.size>5*1024*1024){msg.textContent='حجم الإيصال يجب ألا يتجاوز 5MB.';return}
 const {data:{user}}=await db.auth.getUser();if(!user){openAuth();return}
 const ext=(file.name.split('.').pop()||'jpg').toLowerCase(),path=user.id+'/'+orderId+'/'+crypto.randomUUID()+'.'+ext;
 msg.textContent='جاري رفع الإيصال...';
 const up=await db.storage.from('ofoq-receipts').upload(path,file,{upsert:false,contentType:file.type});
 if(up.error){msg.textContent=up.error.message;return}
 const {error}=await db.rpc('ofoq_submit_payment_receipt',{p_payment_id:paymentId,p_reference:document.getElementById('retryReceiptRef').value.trim(),p_receipt_url:path});
 if(error){msg.textContent=error.message;return}
 toast('تم إرسال الإيصال للمراجعة');customerOrderDetails(orderId)
}
async function openSellerDashboard(){
 const {data:{user}}=await db.auth.getUser();if(!user){openAuth();return}
 const {data:seller}=await db.from('ofoq_sellers').select('*').eq('user_id',user.id).maybeSingle();if(!seller){toast('لم يتم ربط حساب البائع بمتجر بعد');return}
 const [{data:prods},{data:wallet},{data:orders},{data:tx}]=await Promise.all([
  db.from('ofoq_products').select('*').eq('seller_id',seller.id).order('created_at',{ascending:false}),
  db.from('ofoq_seller_wallets').select('*').eq('seller_id',seller.id).maybeSingle(),
  db.from('ofoq_order_items').select('*').eq('seller_id',seller.id).order('created_at',{ascending:false}).limit(30),
  db.from('ofoq_wallet_transactions').select('*').eq('seller_id',seller.id).order('created_at',{ascending:false}).limit(30)
 ]);
 document.getElementById('modal').innerHTML='<div class="fixed inset-0 z-50 bg-cream overflow-auto"><div class="max-w-6xl mx-auto p-4 md:p-8"><div class="flex flex-wrap items-center justify-between gap-3 mb-6"><div><p class="text-gold font-bold text-sm">لوحة البائع</p><h2 class="text-3xl font-extrabold">'+esc(seller.store_name)+'</h2><p class="text-slate-500 text-sm mt-1">حساب معتمد • جدة</p></div><div class="flex gap-2"><button onclick="sellerAddProduct(\''+seller.id+'\')" class="bg-navy text-white px-4 py-3 rounded-2xl font-bold">+ إضافة منتج</button><button onclick="signOut()" class="bg-white px-4 py-3 rounded-2xl">تسجيل الخروج</button></div></div><div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6"><div class="bg-navy text-white rounded-3xl p-5"><span class="text-slate-300 text-sm">الرصيد المتاح</span><div class="text-2xl font-extrabold mt-2">'+money(wallet?.balance_sar||0)+'</div></div><div class="bg-white rounded-3xl p-5"><span class="text-slate-400 text-sm">قيد التسوية</span><div class="text-2xl font-extrabold mt-2">'+money(wallet?.pending_sar||0)+'</div></div><div class="bg-white rounded-3xl p-5"><span class="text-slate-400 text-sm">إجمالي الأرباح</span><div class="text-2xl font-extrabold mt-2">'+money(wallet?.total_earned_sar||0)+'</div></div><div class="bg-white rounded-3xl p-5"><span class="text-slate-400 text-sm">المنتجات</span><div class="text-2xl font-extrabold mt-2">'+(prods?.length||0)+'</div></div></div><div class="grid lg:grid-cols-2 gap-6"><section class="bg-white rounded-3xl p-6"><h3 class="text-xl font-extrabold mb-4">منتجات المتجر</h3><div class="space-y-3">'+(prods||[]).map(x=>'<div class="flex gap-3 items-center border-b pb-3"><img src="'+esc(x.images?.[0]||'')+'" class="w-16 h-16 rounded-xl object-cover bg-slate-100"><div class="flex-1 min-w-0"><b class="block truncate">'+esc(x.name_ar)+'</b><div class="text-sm text-slate-500">'+money(x.price)+' • '+cond(x.condition)+' • المخزون '+(x.stock||0)+'</div></div><span class="text-xs px-2 py-1 rounded-full '+(x.is_active?'bg-emerald-50 text-emerald-700':'bg-slate-100 text-slate-500')+'">'+(x.is_active?'منشور':'مخفي')+'</span></div>').join('')||'<p class="text-slate-400 py-8 text-center">لا توجد منتجات بعد.</p>'+'</div></section><section class="bg-white rounded-3xl p-6"><h3 class="text-xl font-extrabold mb-4">سجل المحفظة</h3><div class="space-y-3">'+(tx||[]).map(x=>'<div class="flex justify-between gap-3 border-b pb-3"><div><b>'+esc(x.description||x.type)+'</b><div class="text-xs text-slate-400">'+new Date(x.created_at).toLocaleString('ar-SA')+'</div></div><strong>'+money(x.amount_sar||0)+'</strong></div>').join('')||'<p class="text-slate-400 py-8 text-center">لا توجد تسويات بعد.</p>'+'</div></section></div><section class="bg-white rounded-3xl p-6 mt-6"><h3 class="text-xl font-extrabold mb-4">آخر المبيعات</h3><div class="space-y-3">'+(orders||[]).slice(0,12).map(o=>'<div class="flex justify-between border-b pb-3"><div><b>'+esc(o.product_name)+'</b><div class="text-xs text-slate-400">الكمية: '+(o.quantity||1)+'</div></div><strong>'+money(o.seller_amount_sar||0)+'</strong></div>').join('')||'<p class="text-slate-400 py-8 text-center">لا توجد مبيعات بعد.</p>'+'</div></section></div></div>'
}
