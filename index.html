<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1730"><meta name="description" content="أُفُق — سوق جدة إلى اليمن"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2225%22 fill=%22%230b1730%22/><text x=%2250%22 y=%2270%22 text-anchor=%22middle%22 font-size=%2260%22 fill=%22white%22>أ</text></svg>"><title>أُفُق | OFOQ</title><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{fontFamily:{sans:['Cairo','Arial']},colors:{navy:'#0b1730',cream:'#f7f5f0',gold:'#d7b66b'}}}}</script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>body{font-family:Cairo,Arial,sans-serif;background:#f7f5f0;color:#101827}.glass{background:rgba(255,255,255,.76);backdrop-filter:blur(18px)}.hide-scroll::-webkit-scrollbar{display:none}.hide-scroll{scrollbar-width:none}.lift{transition:transform .25s,box-shadow .25s}.lift:hover{transform:translateY(-5px);box-shadow:0 20px 45px rgba(11,23,48,.11)}.fade{animation:fade .45s ease both}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.shimmer{background:linear-gradient(90deg,#eee,#f8f8f8,#eee);background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}</style></head>
<body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://hpcdwdcrdznmyzxkkpdp.supabase.co';
const SUPABASE_KEY='sb_publishable_GGThcQrcJyChQkFRrptrxQ_wxwpmovx';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const demo=[
{id:'d1',name_ar:'iPhone 15 Pro Max',price:3499,currency:'SAR',condition:'nearly_new',images:['https://images.unsplash.com/photo-1696446701796-da61225697cc?auto=format&fit=crop&w=900&q=80'],seller:{store_name:'متجر التقنية',rating:4.9}},
{id:'d2',name_ar:'MacBook Pro 14',price:5290,currency:'SAR',condition:'used',images:['https://images.unsplash.com/photo-1517336714739-489689fd1ca8?auto=format&fit=crop&w=900&q=80'],seller:{store_name:'عالم الكمبيوتر',rating:4.8}},
{id:'d3',name_ar:'كرسي Lounge فاخر',price:690,currency:'SAR',condition:'new',images:['https://images.unsplash.com/photo-1555041469-a586c61ea9bc?auto=format&fit=crop&w=900&q=80'],seller:{store_name:'بيت الأثاث',rating:4.7}},
{id:'d4',name_ar:'PlayStation 5 Slim',price:1750,currency:'SAR',condition:'nearly_new',images:['https://images.unsplash.com/photo-1606813907291-d86efa9b94db?auto=format&fit=crop&w=900&q=80'],seller:{store_name:'Gaming Zone',rating:4.9}}
];
const cats=[['📱','إلكترونيات'],['💻','أجهزة كمبيوتر'],['🛋️','أثاث ومنزل'],['👟','ملابس وأحذية'],['🎮','ألعاب'],['🧰','أدوات ومعدات'],['⌚','عطور وإكسسوارات'],['🚗','سيارات وقطع غيار']];
let products=demo,cart=JSON.parse(localStorage.ofoqCart||'[]'),query='';
const money=n=>new Intl.NumberFormat('ar-SA').format(n)+' ر.س';
const cond=c=>({new:'جديد',nearly_new:'شبه جديد',used:'مستعمل'}[c]||c);
function card(p){return `<article class="lift bg-white rounded-[28px] overflow-hidden border border-slate-100 cursor-pointer" onclick="openProduct('${p.id}')"><div class="relative aspect-[4/3] bg-slate-100 overflow-hidden"><img src="${p.images?.[0]||''}" class="w-full h-full object-cover" loading="lazy"><span class="absolute top-3 right-3 px-3 py-1 rounded-full bg-white/90 text-xs font-bold">${cond(p.condition)}</span><button onclick="event.stopPropagation();addCart('${p.id}')" class="absolute bottom-3 left-3 w-11 h-11 rounded-full bg-navy text-white grid place-items-center shadow-lg">+</button></div><div class="p-4"><div class="text-xs text-slate-400 mb-1">${p.seller?.store_name||'بائع موثّق'}</div><h3 class="font-bold truncate">${p.name_ar}</h3><div class="flex items-center justify-between mt-3"><strong class="text-lg">${money(p.price)}</strong><span class="text-xs text-slate-400">★ ${p.seller?.rating||'—'}</span></div><div class="mt-3 text-xs text-slate-500">🚚 شحن من جدة إلى اليمن</div></div></article>`}
function render(){document.getElementById('app').innerHTML=`<header class="sticky top-0 z-40 bg-navy text-white shadow-lg"><div class="max-w-7xl mx-auto px-4"><div class="h-20 flex items-center gap-5"><button class="md:hidden text-2xl" onclick="toggleMenu()">☰</button><div class="shrink-0"><div class="text-3xl font-extrabold tracking-tight">أُفُق</div><div class="text-[9px] tracking-[.3em] text-gold text-center -mt-1">O F O Q</div></div><nav id="menu" class="hidden md:flex gap-5 text-sm text-slate-200"><a href="#home">الرئيسية</a><a href="#categories">التصنيفات</a><a href="#stores">المتاجر</a><a href="#deals">العروض</a></nav><div class="flex items-center gap-2"><button onclick="openAuth()" class="hidden sm:block bg-white/10 border border-white/20 px-4 py-2 rounded-xl text-sm font-bold">تسجيل الدخول</button><button onclick="openAccount()" class="hidden sm:block text-sm">حسابي</button></div><div class="flex-1 max-w-xl mx-auto relative"><input oninput="query=this.value;filter()" value="${query}" class="w-full bg-white text-slate-900 rounded-2xl h-12 pr-5 pl-12 outline-none" placeholder="ابحث عن منتج أو متجر..."><span class="absolute left-4 top-3 text-xl text-slate-400">⌕</span></div><button class="relative text-2xl" onclick="showCart()">🛒<span id="cartCount" class="absolute -top-2 -left-2 bg-gold text-navy text-[10px] w-5 h-5 rounded-full grid place-items-center">${cart.length}</span></button><button class="hidden sm:block text-xl">♡</button></div></div></header>
<main id="home"><section class="max-w-7xl mx-auto px-4 pt-6"><div class="rounded-[36px] overflow-hidden bg-navy min-h-[430px] relative text-white"><img src="https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=1800&q=85" class="absolute inset-0 w-full h-full object-cover opacity-25"><div class="relative p-8 md:p-16 max-w-2xl flex flex-col justify-center min-h-[430px]"><span class="text-gold font-bold mb-4">من جدة إلى اليمن</span><h1 class="text-4xl md:text-6xl font-extrabold leading-tight">اكتشف منتجات<br><span class="text-gold">سوق جدة</span> بسهولة.</h1><p class="mt-5 text-slate-200 text-lg leading-8">تسوّق من متاجر وباعة جدة، واطلب وصول مشترياتك إلى اليمن عبر منظومة شحن واضحة وآمنة.</p><div class="flex gap-3 mt-8"><a href="#products" class="bg-white text-navy px-6 py-3 rounded-2xl font-bold">ابدأ التسوق</a><a href="#how" class="border border-white/30 px-6 py-3 rounded-2xl font-bold">كيف يعمل؟</a></div></div></div></section>
<section id="categories" class="max-w-7xl mx-auto px-4 py-10"><div class="flex items-end justify-between mb-5"><div><p class="text-gold font-bold text-sm">استكشف</p><h2 class="text-2xl font-extrabold">تسوّق حسب الفئة</h2></div></div><div class="flex gap-3 overflow-x-auto hide-scroll pb-2">${cats.map(c=>`<button onclick="query='${c[1]}';filter()" class="shrink-0 bg-white border border-slate-100 rounded-2xl px-5 py-4 min-w-[125px] text-right lift"><div class="text-2xl mb-2">${c[0]}</div><b class="text-sm">${c[1]}</b></button>`).join('')}</div></section>
<section id="products" class="max-w-7xl mx-auto px-4 pb-14"><div class="flex items-end justify-between mb-5"><div><p class="text-gold font-bold text-sm">اختيارات أُفُق</p><h2 class="text-2xl font-extrabold">منتجات تستحق المشاهدة</h2></div><span id="resultText" class="text-sm text-slate-400"></span></div><div id="grid" class="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">${products.map(card).join('')}</div></section>
<section id="how" class="bg-white border-y border-slate-100"><div class="max-w-7xl mx-auto px-4 py-14"><h2 class="text-3xl font-extrabold text-center">من جدة إلى بابك في اليمن</h2><div class="grid md:grid-cols-4 gap-5 mt-10">${[['01','اختر المنتج','تصفح منتجات الباعة والمتاجر في جدة.'],['02','أضف للسلة','اجمع مشترياتك حتى من متاجر مختلفة.'],['03','ادفع لأُفُق','نحسب المنتج والشحن والخدمات بوضوح.'],['04','تتبع طلبك','تابع الطلب حتى وصوله إلى اليمن.']].map(x=>`<div class="rounded-3xl bg-cream p-6"><span class="text-gold font-extrabold">${x[0]}</span><h3 class="font-bold text-lg mt-5">${x[1]}</h3><p class="text-slate-500 text-sm mt-2 leading-7">${x[2]}</p></div>`).join('')}</div></div></section>
</main><footer class="bg-navy text-white mt-12"><div class="max-w-7xl mx-auto px-4 py-10 flex flex-col md:flex-row justify-between gap-6"><div><div class="text-3xl font-extrabold">أُفُق</div><p class="text-slate-400 mt-2">سوق يربط جدة باليمن.</p></div><div class="text-slate-400 text-sm">© 2026 OFOQ. جميع الحقوق محفوظة.</div></div></footer><div id="modal"></div>`;loadProducts();updateCount()}
async function loadProducts(){try{const {data}=await db.from('ofoq_products').select('*, seller:ofoq_sellers(store_name,rating)').eq('is_active',true).order('created_at',{ascending:false});if(data?.length){products=data;drawGrid(products)}}catch(e){console.log(e)}}
function drawGrid(list){document.getElementById('grid').innerHTML=list.length?list.map(card).join(''):'<div class="col-span-full py-16 text-center text-slate-400">لا توجد نتائج مطابقة.</div>';document.getElementById('resultText').textContent=list.length+' منتج'}
function filter(){const q=query.toLowerCase();drawGrid(products.filter(p=>(p.name_ar||'').toLowerCase().includes(q)||(p.name_en||'').toLowerCase().includes(q)||(p.seller?.store_name||'').toLowerCase().includes(q)))}
function updateCount(){document.getElementById('cartCount').textContent=cart.length}
function addCart(id){const p=products.find(x=>x.id===id);if(!p)return;if(!cart.find(x=>x.id===id))cart.push({id:p.id,name:p.name_ar,price:p.price,image:p.images?.[0]});localStorage.ofoqCart=JSON.stringify(cart);updateCount();toast('تمت إضافة المنتج إلى السلة')}
function toast(t){const d=document.createElement('div');d.className='fixed bottom-5 left-5 z-50 bg-navy text-white px-5 py-3 rounded-2xl shadow-xl fade';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function showCart(){document.getElementById('modal').innerHTML='<div onclick="this.remove()" class="fixed inset-0 z-50 bg-black/40 flex items-end md:items-center justify-center p-4"><div onclick="event.stopPropagation()" class="bg-white rounded-[30px] p-6 w-full max-w-lg max-h-[80vh] overflow-auto"><div class="flex justify-between items-center"><h2 class="text-2xl font-extrabold">سلة التسوق</h2><button onclick="document.getElementById(\'modal\').innerHTML=\'\'">✕</button></div>'+ (cart.length?cart.map(x=>'<div class="flex gap-3 py-4 border-b"><img src="'+x.image+'" class="w-16 h-16 rounded-xl object-cover"><div class="flex-1"><b>'+x.name+'</b><div class="text-slate-500">'+money(x.price)+'</div></div></div>').join('')+'<button class="w-full mt-5 bg-navy text-white py-4 rounded-2xl font-bold">متابعة الدفع</button>':'<div class="py-14 text-center text-slate-400">السلة فارغة حاليًا.</div>')+'</div></div>'}
function openProduct(id){const p=products.find(x=>x.id===id);if(!p)return;document.getElementById('modal').innerHTML='<div onclick="this.remove()" class="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4"><div onclick="event.stopPropagation()" class="bg-white rounded-[32px] overflow-hidden w-full max-w-4xl max-h-[90vh] overflow-auto"><div class="grid md:grid-cols-2"><img src="'+p.images?.[0]+'" class="w-full h-80 md:h-full object-cover"><div class="p-7"><button onclick="document.getElementById(\'modal\').innerHTML=\'\'" class="float-left">✕</button><div class="text-sm text-slate-400 mt-8">'+(p.seller?.store_name||'بائع')+'</div><h2 class="text-3xl font-extrabold mt-2">'+p.name_ar+'</h2><div class="text-2xl font-extrabold mt-5">'+money(p.price)+'</div><span class="inline-block mt-4 bg-cream px-3 py-1 rounded-full text-sm">'+cond(p.condition)+'</span><p class="text-slate-500 leading-8 mt-6">'+(p.description_ar||'منتج متاح للطلب من جدة مع خدمة شحن إلى اليمن. تظهر تفاصيل الشحن والمدة في مرحلة الطلب.')+'</p><button onclick="addCart(\''+p.id+'\');document.getElementById(\'modal\').innerHTML=\'\'" class="w-full mt-8 bg-navy text-white py-4 rounded-2xl font-bold">أضف إلى السلة</button></div></div></div></div>'}
function openAuth(){document.getElementById('modal').innerHTML=`<div class="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4"><div class="bg-white rounded-[30px] p-7 w-full max-w-md"><div class="flex justify-between"><h2 class="text-2xl font-extrabold">حساب أُفُق</h2><button onclick="document.getElementById('modal').innerHTML=''">✕</button></div><p class="text-slate-500 mt-2 text-sm">سجّل الدخول أو أنشئ حسابًا جديدًا.</p><input id="authName" class="w-full mt-6 p-4 rounded-2xl bg-slate-50" placeholder="الاسم (للتسجيل فقط)"><input id="authEmail" type="email" class="w-full mt-3 p-4 rounded-2xl bg-slate-50" placeholder="البريد الإلكتروني"><input id="authPass" type="password" class="w-full mt-3 p-4 rounded-2xl bg-slate-50" placeholder="كلمة المرور"><div class="grid grid-cols-2 gap-3 mt-5"><button onclick="signIn()" class="bg-navy text-white py-3 rounded-2xl font-bold">دخول</button><button onclick="signUp()" class="border border-slate-200 py-3 rounded-2xl font-bold">حساب جديد</button></div><p id="authMsg" class="text-sm text-center mt-4 text-slate-500"></p></div></div>`}
async function signIn(){const email=document.getElementById('authEmail').value.trim(),password=document.getElementById('authPass').value;const {error}=await db.auth.signInWithPassword({email,password});document.getElementById('authMsg').textContent=error?error.message:'تم تسجيل الدخول بنجاح';if(!error)setTimeout(()=>{document.getElementById('modal').innerHTML='';render()},700)}
async function signUp(){const name=document.getElementById('authName').value.trim(),email=document.getElementById('authEmail').value.trim(),password=document.getElementById('authPass').value;if(password.length<6){document.getElementById('authMsg').textContent='كلمة المرور يجب أن تكون 6 أحرف على الأقل.';return}const {data,error}=await db.auth.signUp({email,password,options:{data:{full_name:name}}});document.getElementById('authMsg').textContent=error?error.message:(data.session?'تم إنشاء الحساب وتسجيل الدخول.':'تم إنشاء الحساب. تحقق من بريدك الإلكتروني إذا طُلب منك ذلك.')}
async function openAccount(){const {data:{user}}=await db.auth.getUser();if(!user){openAuth();return}const {data:p}=await db.from('ofoq_profiles').select('*').eq('id',user.id).maybeSingle();document.getElementById('modal').innerHTML=`<div class="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4"><div class="bg-white rounded-[30px] p-7 w-full max-w-md"><div class="flex justify-between"><h2 class="text-2xl font-extrabold">مرحبًا ${p?.full_name||user.email}</h2><button onclick="document.getElementById('modal').innerHTML=''">✕</button></div><div class="mt-6 rounded-2xl bg-cream p-5"><div class="text-sm text-slate-500">نوع الحساب</div><div class="font-bold mt-1">${p?.role||'customer'}</div><div class="text-sm text-slate-500 mt-4">البريد</div><div class="font-bold mt-1 break-all">${user.email}</div></div><button onclick="signOut()" class="w-full mt-5 border border-red-200 text-red-600 py-3 rounded-2xl font-bold">تسجيل الخروج</button></div></div>`}
async function signOut(){await db.auth.signOut();document.getElementById('modal').innerHTML='';render()}
function toggleMenu(){document.getElementById('menu').classList.toggle('hidden')}
render();
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script></body></html>
